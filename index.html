<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز مطعم دغشوفيسكي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

.seats {
  display: none;
  grid-template-columns: repeat(5, 70px);
  gap: 10px;
  justify-content: center;
  margin: 20px;
}

.seat {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  text-align: center;
  padding: 5px;
}

.available { background: #22c55e; }
.taken { background: #ef4444; }

input {
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  width: 200px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#cancelBtn {
  display: none;
  background: #ef4444;
  color: white;
}

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 200px;
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 12px;
  font-size: 13px;
  text-align: right;
  color: #fff;
  backdrop-filter: blur(8px);
}

.sidebar h3 {
  margin-top: 0;
  font-size: 14px;
}

/* (اختياري للجوال) */
@media (max-width: 768px) {
  .sidebar {
    position: static;
    width: 90%;
    margin: 10px auto;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🍽️ حجز مطعم 505</h1>

  <input type="text" id="username" placeholder="اكتب اسمك">
  <br><br>
  <button onclick="start()">دخول</button>

  <div class="seats" id="seats"></div>

  <p id="status"></p>
  <button id="cancelBtn" onclick="cancelBooking()">❌ إلغاء حجزي</button>
</div>

<div class="sidebar">
  <h3>📘 معلومات المشروع</h3>
  <p>المادة: مقدمة في المعالجات الصغرى</p>
  <p>اشراف الدكتور: د. وليد سعد</p>
  <hr>
  <p>👥 الطلاب:</p>
  <p>سيف القحطاني</p>
  <p>خالد العتيبي</p>
  <p>ضيف الله العتيبي</p>
  <p>علي الصعب</p>
  <p>سلطان جرولي</p>
</div>

<script>
let totalSeats = 20;
let seats = JSON.parse(localStorage.getItem("seats")) || Array(totalSeats).fill(null);
let currentUser = null;

function start() {
  let name = document.getElementById("username").value;

  if (!name) {
    document.getElementById("status").innerText = "اكتب اسمك أولاً";
    return;
  }

  currentUser = name;

  document.getElementById("seats").style.display = "grid";
  document.getElementById("cancelBtn").style.display = "inline-block";

  document.getElementById("status").innerText = "اختر مقعد واحد فقط";

  renderSeats();
}

function renderSeats() {
  let container = document.getElementById("seats");
  container.innerHTML = "";

  seats.forEach((name, index) => {
    let div = document.createElement("div");
    div.classList.add("seat");
    div.classList.add(name ? "taken" : "available");

    div.innerHTML = name ? name : (index + 1);

    div.onclick = () => bookSeat(index);

    container.appendChild(div);
  });
}

function bookSeat(index) {
  if (!currentUser) return;

  if (seats.includes(currentUser)) {
    document.getElementById("status").innerText = "حجزت بالفعل مقعد واحد";
    return;
  }

  if (seats[index]) {
    document.getElementById("status").innerText = "المقعد محجوز";
    return;
  }

  seats[index] = currentUser;
  localStorage.setItem("seats", JSON.stringify(seats));

  document.getElementById("status").innerText = "تم الحجز بنجاح";
  renderSeats();
}

function cancelBooking() {
  if (!currentUser) return;

  let index = seats.indexOf(currentUser);

  if (index === -1) {
    document.getElementById("status").innerText = "ما عندك حجز";
    return;
  }

  seats[index] = null;
  localStorage.setItem("seats", JSON.stringify(seats));

  document.getElementById("status").innerText = "تم إلغاء الحجز";
  renderSeats();
}

// إعادة تعيين كل 5 دقائق
setInterval(() => {
  seats = Array(totalSeats).fill(null);
  localStorage.setItem("seats", JSON.stringify(seats));
  renderSeats();
}, 300000);

renderSeats();
</script>

</body>
</html>
