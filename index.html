<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز مطعم 505</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

h1 { margin-top: 20px; }

.seats {
  display: grid;
  grid-template-columns: repeat(5, 60px);
  gap: 10px;
  justify-content: center;
  margin: 30px;
}

.seat {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.available { background: #22c55e; }
.taken { background: #ef4444; }

.info {
  margin-top: 10px;
}

.footer {
  position: fixed;
  bottom: 10px;
  left: 10px;
  text-align: left;
  font-size: 14px;
  color: #ccc;
}
</style>
</head>

<body>

<h1>🍽️ حجز مطعم 505</h1>
<p>اختر مقعدك</p>

<div class="seats" id="seats"></div>

<p class="info" id="status"></p>

<div class="footer">
  <p>المادة: المعالجات الضغرى</p>
  <p>الدكتور: د. وليد</p>
  <p>الطلاب:</p>
  <p>سيف القحطاني</p>
  <p>خالد العتيبي</p>
  <p>ضيف الله العتيبي</p>
  <p>علي الصعب</p>
  <p>سلطان جرولي</p>
</div>

<script>
let totalSeats = 20;
let seats = JSON.parse(localStorage.getItem("seats")) || Array(totalSeats).fill(false);

function renderSeats() {
  let container = document.getElementById("seats");
  container.innerHTML = "";

  seats.forEach((taken, index) => {
    let div = document.createElement("div");
    div.classList.add("seat");
    div.classList.add(taken ? "taken" : "available");
    div.innerText = index + 1;

    div.onclick = () => bookSeat(index);

    container.appendChild(div);
  });
}

function bookSeat(index) {
  if (seats[index]) {
    document.getElementById("status").innerText = "هذا المقعد محجوز";
    return;
  }

  seats[index] = true;
  localStorage.setItem("seats", JSON.stringify(seats));
  document.getElementById("status").innerText = "تم حجز المقعد رقم " + (index+1);

  renderSeats();
}

// تحديث كل 10 دقائق
setInterval(() => {
  seats = JSON.parse(localStorage.getItem("seats")) || seats;
  renderSeats();
}, 600000);

renderSeats();
</script>

</body>
</html>
