<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز مطعم 505</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

.seats {
  display: grid;
  grid-template-columns: repeat(5, 70px);
  gap: 10px;
  justify-content: center;
  margin: 20px;
}

.seat {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  text-align: center;
  padding: 5px;
}

.available { background: #22c55e; }
.taken { background: #ef4444; }

input {
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  width: 200px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.refresh { background: orange; color: white; }

.footer {
  position: fixed;
  bottom: 10px;
  left: 10px;
  text-align: left;
  font-size: 14px;
  color: #ccc;
}
</style>
</head>

<body>

<div class="container">
  <h1>🍽️ حجز مطعم 505</h1>

  <input type="text" id="username" placeholder="اكتب اسمك أولاً">
  <br><br>

  <button onclick="refreshSeats()" class="refresh">🔄 تحديث</button>

  <div class="seats" id="seats"></div>

  <p id="status"></p>
</div>

<div class="footer">
  <p>المادة: المعالجات الضغرى</p>
  <p>الدكتور: د. وليد</p>
  <p>الطلاب:</p>
  <p>سيف القحطاني</p>
  <p>خالد العتيبي</p>
  <p>ضيف الله العتيبي</p>
  <p>علي الصعب</p>
  <p>سلطان جرولي</p>
</div>

<script>
let totalSeats = 20;
let seats = JSON.parse(localStorage.getItem("seats")) || Array(totalSeats).fill(null);

function renderSeats() {
  let container = document.getElementById("seats");
  container.innerHTML = "";

  seats.forEach((name, index) => {
    let div = document.createElement("div");
    div.classList.add("seat");
    div.classList.add(name ? "taken" : "available");

    div.innerHTML = name ? name : (index + 1);

    div.onclick = () => bookSeat(index);

    container.appendChild(div);
  });
}

function bookSeat(index) {
  let user = document.getElementById("username").value;

  if (!user) {
    document.getElementById("status").innerText = "اكتب اسمك أولاً";
    return;
  }

  if (seats[index]) {
    document.getElementById("status").innerText = "المقعد محجوز بواسطة " + seats[index];
    return;
  }

  seats[index] = user;
  localStorage.setItem("seats", JSON.stringify(seats));

  document.getElementById("status").innerText = "تم الحجز باسم " + user;
  renderSeats();
}

function refreshSeats() {
  seats = JSON.parse(localStorage.getItem("seats")) || seats;
  renderSeats();
  document.getElementById("status").innerText = "تم التحديث";
}

// تحديث تلقائي كل 10 دقايق
setInterval(refreshSeats, 600000);

renderSeats();
</script>

</body>
</html>
